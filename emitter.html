<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envoyer sur le stream</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f1117;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    background: #1a1d27;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  label { display:block; font-size: 13px; color: #9aa0b4; margin: 16px 0 6px; }
  input[type=text], input[type=file], input:not([type]) {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333748;
    background: #10121a;
    color: #f2f2f2;
    font-size: 14px;
  }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #7c5cff, #5c8dff);
    color: white;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  #status { margin-top: 14px; font-size: 13px; color: #9aa0b4; }
  #sendZone { display: none; margin-top: 10px; border-top: 1px solid #2a2e3d; padding-top: 10px; }
  #log { margin-top: 14px; font-size: 12px; color: #6ee7b7; max-height: 100px; overflow-y: auto; }
  #log div { padding: 2px 0; }
</style>
</head>
<body>
  <div class="card">
    <h1>📡 Envoyer sur le stream</h1>

    <label for="room">Code de la room (donné par le streamer)</label>
    <input type="text" id="room" placeholder="ex: ABC123" autocomplete="off">
    <button id="connectBtn">Se connecter</button>
    <div id="status">Non connecté</div>

    <div id="sendZone">
      <label for="name">Ton prénom (optionnel, affiché sur le stream)</label>
      <input type="text" id="name" placeholder="Ton prénom">

      <label for="file">Image ou vidéo</label>
      <input type="file" id="file" accept="image/*,video/*">
      <button id="sendFileBtn">Envoyer le fichier</button>

      <label for="text">Ou un message texte</label>
      <input type="text" id="text" placeholder="Écris un message...">
      <button id="sendTextBtn">Envoyer le texte</button>

      <div id="log"></div>
    </div>
  </div>

<script>
  let peer, conn;
  const $ = id => document.getElementById(id);

  const params = new URLSearchParams(location.search);
  if (params.get('room')) $('room').value = params.get('room');
  $('name').value = localStorage.getItem('streamSenderName') || '';

  function log(msg) {
    const p = document.createElement('div');
    p.textContent = msg;
    $('log').prepend(p);
  }

  function connect() {
    const roomCode = $('room').value.trim();
    if (!roomCode) { alert('Mets le code de la room'); return; }
    $('status').textContent = 'Connexion en cours...';
    $('status').style.color = '#9aa0b4';

    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(roomCode, { reliable: true });
      conn.on('open', () => {
        $('status').textContent = '✅ Connecté à la room ' + roomCode;
        $('status').style.color = '#6ee7b7';
        $('sendZone').style.display = 'block';
      });
      conn.on('close', () => {
        $('status').textContent = '❌ Déconnecté — reclique sur "Se connecter"';
        $('status').style.color = '#f87171';
        $('sendZone').style.display = 'none';
      });
      conn.on('error', err => log('Erreur connexion: ' + err));
    });
    peer.on('error', err => {
      $('status').textContent = '❌ Erreur: ' + err.type + ' (le code existe-t-il ? le streamer est-il bien connecté ?)';
      $('status').style.color = '#f87171';
    });
  }

  $('connectBtn').onclick = connect;

  $('sendFileBtn').onclick = () => {
    const f = $('file').files[0];
    if (!f) { alert('Choisis un fichier'); return; }
    if (!conn || !conn.open) { alert('Pas connecté'); return; }
    const isVideo = f.type.startsWith('video');
    const reader = new FileReader();
    reader.onload = () => {
      conn.send({
        type: isVideo ? 'video' : 'image',
        mime: f.type,
        filename: f.name,
        name: $('name').value.trim(),
        buffer: reader.result
      });
      log('✔ Envoyé : ' + f.name);
      $('file').value = '';
    };
    reader.readAsArrayBuffer(f);
  };

  $('sendTextBtn').onclick = () => {
    const txt = $('text').value.trim();
    if (!txt) return;
    if (!conn || !conn.open) { alert('Pas connecté'); return; }
    conn.send({ type: 'text', text: txt, name: $('name').value.trim() });
    log('✔ Texte envoyé : ' + txt);
    $('text').value = '';
  };

  $('name').addEventListener('change', () => {
    localStorage.setItem('streamSenderName', $('name').value.trim());
  });

  // Auto-connexion si un code est déjà dans l'URL
  if (params.get('room')) connect();
</script>
</body>
</html>
