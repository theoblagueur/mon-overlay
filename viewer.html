<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Stream Overlay</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #setup {
    position: fixed; top: 16px; left: 16px; max-width: 480px;
    background: rgba(15,17,23,0.92); color: #fff; text-align: left; padding: 16px 20px;
    border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #setup.show { opacity: 1; }
  #setup h1 { font-size: 16px; margin: 0 0 8px; }
  #setup p { margin: 6px 0; }
  #setup code {
    background: #1a1d27; padding: 4px 10px; border-radius: 6px;
    font-size: 18px; letter-spacing: 1px; display: inline-block; margin: 4px 0;
  }
  #setup .small { font-size: 12px; word-break: break-all; letter-spacing: normal; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .item {
    max-width: 90vw; max-height: 90vh;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    transform: scale(0.96);
    border-radius: 10px;
  }
  .item.show { opacity: 1; transform: scale(1); }
  #textOverlay {
    font-size: 52px; font-weight: 700; color: white;
    text-shadow: 0 0 12px black, 0 0 24px black;
    text-align: center; max-width: 80vw;
  }
  #senderTag {
    position: absolute; bottom: 16px; right: 24px;
    color: white; font-size: 16px;
    text-shadow: 0 0 6px black, 0 0 12px black;
    opacity: 0; transition: opacity 0.4s ease;
  }
  #senderTag.show { opacity: 0.85; }
</style>
</head>
<body>
  <div id="setup"></div>
  <div id="stage"></div>
  <div id="senderTag"></div>

<script>
  const params = new URLSearchParams(location.search);
  let room = params.get('room');
  const imgDuration = parseInt(params.get('imgDuration') || '8000', 10);
  const textDuration = parseInt(params.get('textDuration') || '6000', 10);
  const videoMaxDuration = params.get('videoMaxDuration') ? parseInt(params.get('videoMaxDuration'), 10) : null;

  function randCode() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }
  if (!room) room = randCode();

  const setupDiv = document.getElementById('setup');
  const stage = document.getElementById('stage');
  const senderTag = document.getElementById('senderTag');

  const peer = new Peer(room);

  const SETUP_DISPLAY_MS = 12000; // durée d'affichage de l'encart de connexion, ensuite invisible

  function flashSetup(html) {
    setupDiv.innerHTML = html;
    setupDiv.classList.add('show');
    clearTimeout(flashSetup._t);
    flashSetup._t = setTimeout(() => setupDiv.classList.remove('show'), SETUP_DISPLAY_MS);
  }

  peer.on('open', id => {
    const emitterUrl = location.href.replace(/viewer\.html.*$/, 'emitter.html') + '?room=' + id;
    console.log('Overlay prêt — room:', id, '— lien pote:', emitterUrl);
    flashSetup(
      '<h1>🎥 Overlay prêt</h1>' +
      '<p>Code de la room : <code>' + id + '</code></p>' +
      '<p>Lien à envoyer :</p>' +
      '<code class="small">' + emitterUrl + '</code>'
    );
  });

  peer.on('error', err => {
    console.error('Erreur peer:', err.type);
    flashSetup('<h1>Erreur</h1><p>' + err.type + '</p>');
  });



  peer.on('connection', conn => {
    flashSetup('<h1>✅ Connecté</h1><p>Un pote vient de se connecter.</p>');
    conn.on('data', data => enqueue(data));
  });

  // ---- File d'attente ----
  const queue = [];
  let playing = false;

  function enqueue(item) { queue.push(item); processQueue(); }
  function processQueue() {
    if (playing || queue.length === 0) return;
    playing = true;
    render(queue.shift(), () => { playing = false; processQueue(); });
  }

  function showSender(name) {
    senderTag.textContent = name ? ('Envoyé par ' + name) : '';
    senderTag.classList.toggle('show', !!name);
  }

  function finish(el, done) {
    el.classList.remove('show');
    setTimeout(() => { el.remove(); showSender(null); done(); }, 400);
  }

  function render(data, done) {
    stage.innerHTML = '';
    showSender(data.name);

    if (data.type === 'text') {
      const div = document.createElement('div');
      div.id = 'textOverlay';
      div.className = 'item';
      div.textContent = data.text;
      stage.appendChild(div);
      requestAnimationFrame(() => div.classList.add('show'));
      setTimeout(() => finish(div, done), textDuration);

    } else if (data.type === 'image') {
      const blob = new Blob([data.buffer], { type: data.mime });
      const url = URL.createObjectURL(blob);
      const img = document.createElement('img');
      img.src = url;
      img.className = 'item';
      stage.appendChild(img);
      requestAnimationFrame(() => img.classList.add('show'));
      setTimeout(() => { URL.revokeObjectURL(url); finish(img, done); }, imgDuration);

    } else if (data.type === 'video') {
      const blob = new Blob([data.buffer], { type: data.mime });
      const url = URL.createObjectURL(blob);
      const vid = document.createElement('video');
      vid.src = url;
      vid.className = 'item';
      vid.autoplay = true;
      vid.playsInline = true;
      stage.appendChild(vid);
      requestAnimationFrame(() => vid.classList.add('show'));

      let capTimer = null;
      if (videoMaxDuration) {
        capTimer = setTimeout(() => { URL.revokeObjectURL(url); finish(vid, done); }, videoMaxDuration);
      }
      vid.onended = () => {
        if (capTimer) clearTimeout(capTimer);
        URL.revokeObjectURL(url);
        finish(vid, done);
      };
      vid.play().catch(() => {
        // Si l'autoplay avec son est bloqué : on démarre muet puis on démute
        vid.muted = true;
        vid.play().then(() => setTimeout(() => { vid.muted = false; }, 150));
      });
    }
  }
</script>
</body>
</html>
