<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Stream Overlay</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #setup {
    position: fixed; top: 16px; left: 16px; max-width: 480px;
    background: rgba(15,17,23,0.92); color: #fff; text-align: left; padding: 16px 20px;
    border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #setup.show { opacity: 1; }
  #setup h1 { font-size: 16px; margin: 0 0 8px; }
  #setup p { margin: 6px 0; }
  #setup code {
    background: #1a1d27; padding: 4px 10px; border-radius: 6px;
    font-size: 18px; letter-spacing: 1px; display: inline-block; margin: 4px 0;
  }
  #setup .small { font-size: 12px; word-break: break-all; letter-spacing: normal; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .fadeWrap {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    max-height: 100%; max-width: 100%;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    transform: scale(0.96);
  }
  .fadeWrap.show { opacity: 1; transform: scale(1); }
  .item { max-width: 90vw; max-height: 58vh; border-radius: 10px; display: block; flex-shrink: 1; min-height: 0; object-fit: contain; }
  .senderHeader {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: -4px;
    flex-shrink: 0;
  }
  .senderAvatar {
    width: 56px; height: 56px; border-radius: 50%;
    border: 3px solid #57F287;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(0,0,0,0.7);
  }
  .senderName {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 32px; font-weight: 900; color: white;
    -webkit-text-stroke: 2px black;
    text-shadow: 0 0 8px black, 0 0 16px black;
    letter-spacing: 0.5px;
  }
  #textOverlay {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 68px; font-weight: 900; color: white;
    -webkit-text-stroke: 3px black;
    text-shadow: 0 0 10px black, 0 0 20px black, 0 4px 6px rgba(0,0,0,0.7);
    text-align: center; max-width: 85vw;
    line-height: 1.2;
  }
  .caption {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 52px; font-weight: 800; color: white;
    -webkit-text-stroke: 2.5px black;
    text-shadow: 0 0 10px black, 0 0 18px black, 0 3px 5px rgba(0,0,0,0.7);
    text-align: center; max-width: 85vw;
    line-height: 1.2;
    position: relative; z-index: 2;
    margin-top: -38px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div id="setup"></div>
  <div id="stage"></div>

<script>
  const params = new URLSearchParams(location.search);
  let room = params.get('room');

  function randCode() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

  if (!room) {
    // Pas de ?room= dans l'URL : on réutilise le dernier code connu au lieu
    // d'en générer un nouveau au hasard à chaque refresh.
    room = localStorage.getItem('overlayRoomCode') || randCode();
    console.warn('Aucun ?room= dans l\'URL — utilisation du dernier code connu :', room, '. Pense à ajouter ?room=' + room + ' à l\'URL dans OBS pour fixer ce code définitivement.');
  }
  localStorage.setItem('overlayRoomCode', room);

  const imgDuration = parseInt(params.get('imgDuration') || '8000', 10);
  const textDuration = parseInt(params.get('textDuration') || '6000', 10);
  const videoMaxDuration = params.get('videoMaxDuration') ? parseInt(params.get('videoMaxDuration'), 10) : null;

  const setupDiv = document.getElementById('setup');
  const stage = document.getElementById('stage');

  const peer = new Peer(room);

  const SETUP_DISPLAY_MS = 12000; // durée d'affichage de l'encart de connexion, ensuite invisible

  function flashSetup(html) {
    setupDiv.innerHTML = html;
    setupDiv.classList.add('show');
    clearTimeout(flashSetup._t);
    flashSetup._t = setTimeout(() => setupDiv.classList.remove('show'), SETUP_DISPLAY_MS);
  }

  peer.on('open', id => {
    const emitterUrl = location.href.replace(/viewer\.html.*$/, 'emitter.html') + '?room=' + id;
    console.log('Overlay prêt — room:', id, '— lien pote:', emitterUrl);
    flashSetup(
      '<h1>🎥 Overlay prêt</h1>' +
      '<p>Code de la room : <code>' + id + '</code></p>' +
      '<p>Lien à envoyer :</p>' +
      '<code class="small">' + emitterUrl + '</code>'
    );
  });

  peer.on('error', err => {
    console.error('Erreur peer:', err.type);
    flashSetup('<h1>Erreur</h1><p>' + err.type + '</p>');
  });



  peer.on('connection', conn => {
    flashSetup('<h1>✅ Connecté</h1><p>Un pote vient de se connecter.</p>');
    conn.on('data', data => enqueue(data));
  });

  // ---- File d'attente ----
  const queue = [];
  let playing = false;

  function enqueue(item) { queue.push(item); processQueue(); }
  function processQueue() {
    if (playing || queue.length === 0) return;
    playing = true;
    render(queue.shift(), () => { playing = false; processQueue(); });
  }

  function finish(el, done) {
    el.classList.remove('show');
    setTimeout(() => { el.remove(); done(); }, 400);
  }

  function render(data, done) {
    stage.innerHTML = '';

    const wrap = document.createElement('div');
    wrap.className = 'fadeWrap';
    stage.appendChild(wrap);

    if (data.name) {
      const header = document.createElement('div');
      header.className = 'senderHeader';
      if (data.avatar) {
        const avatar = document.createElement('img');
        avatar.className = 'senderAvatar';
        avatar.src = data.avatar;
        header.appendChild(avatar);
      }
      const nameEl = document.createElement('span');
      nameEl.className = 'senderName';
      nameEl.textContent = data.name;
      header.appendChild(nameEl);
      wrap.appendChild(header);
    }

    function addCaptionIfAny() {
      if (data.caption) {
        const cap = document.createElement('div');
        cap.className = 'caption';
        cap.textContent = data.caption;
        wrap.appendChild(cap);
      }
    }

    if (data.type === 'text') {
      const div = document.createElement('div');
      div.id = 'textOverlay';
      div.textContent = data.text;
      wrap.appendChild(div);
      requestAnimationFrame(() => wrap.classList.add('show'));
      setTimeout(() => finish(wrap, done), textDuration);

    } else if (data.type === 'image') {
      const blob = new Blob([data.buffer], { type: data.mime });
      const url = URL.createObjectURL(blob);
      const img = document.createElement('img');
      img.src = url;
      img.className = 'item';
      wrap.appendChild(img);
      addCaptionIfAny();
      requestAnimationFrame(() => wrap.classList.add('show'));
      setTimeout(() => { URL.revokeObjectURL(url); finish(wrap, done); }, imgDuration);

    } else if (data.type === 'video') {
      const blob = new Blob([data.buffer], { type: data.mime });
      const url = URL.createObjectURL(blob);
      const vid = document.createElement('video');
      vid.src = url;
      vid.className = 'item';
      vid.autoplay = true;
      vid.playsInline = true;
      wrap.appendChild(vid);
      addCaptionIfAny();
      requestAnimationFrame(() => wrap.classList.add('show'));

      // Verrou anti-double-appel : évite qu'un onended tardif (après une coupure
      // par videoMaxDuration) ne fasse avancer la file une deuxième fois et ne
      // désynchronise le compteur (cause du blocage définitif).
      let closed = false;
      let capTimer = null;

      function closeVideo() {
        if (closed) return;
        closed = true;
        if (capTimer) clearTimeout(capTimer);
        vid.onended = null;
        vid.onerror = null;
        vid.pause();
        URL.revokeObjectURL(url);
        finish(wrap, done);
      }

      if (videoMaxDuration) {
        capTimer = setTimeout(closeVideo, videoMaxDuration);
      }
      vid.onended = closeVideo;
      // Filet de sécurité : si la vidéo est corrompue / format non supporté /
      // échoue à se lire, on passe quand même à l'item suivant au lieu de bloquer.
      vid.onerror = () => { console.warn('Vidéo illisible, passage au suivant'); closeVideo(); };

      vid.play().catch(() => {
        // Si l'autoplay avec son est bloqué : on démarre muet puis on démute
        vid.muted = true;
        vid.play()
          .then(() => setTimeout(() => { vid.muted = false; }, 150))
          .catch(() => { console.warn('Lecture vidéo impossible, passage au suivant'); closeVideo(); });
      });
    }
  }
</script>
</body>
</html>
